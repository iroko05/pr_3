<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3050 990" font-family="Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <marker id="arrowThick" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- ============= ЗАГОЛОВОК ============= -->
  <rect x="0" y="0" width="3050" height="40" fill="#d9d9d9" stroke="#000"/>
  <text x="1525" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">
    BPMN-диаграмма: Организация выступления музыкального коллектива (инициатор — сам коллектив)
  </text>

  <!-- ============= ДОРОЖКИ ============= -->
  <!-- Дорожка 1: Музыкальный коллектив -->
  <rect x="50" y="40" width="3000" height="230" fill="#f5faff" stroke="#000"/>
  <rect x="0" y="40" width="50" height="230" fill="#cfe3f7" stroke="#000"/>
  <text x="25" y="155" text-anchor="middle" font-size="12" font-weight="bold" transform="rotate(-90 25 155)">
    Музыкальный коллектив (инициатор)
  </text>

  <!-- Дорожка 2: Администратор коллектива -->
  <rect x="50" y="270" width="3000" height="450" fill="#fafafa" stroke="#000"/>
  <rect x="0" y="270" width="50" height="450" fill="#e0e0e0" stroke="#000"/>
  <text x="25" y="495" text-anchor="middle" font-size="12" font-weight="bold" transform="rotate(-90 25 495)">
    Администратор коллектива
  </text>

  <!-- Дорожка 3: Музыканты и тех. персонал -->
  <rect x="50" y="720" width="3000" height="230" fill="#fff7f0" stroke="#000"/>
  <rect x="0" y="720" width="50" height="230" fill="#f5dcc4" stroke="#000"/>
  <text x="25" y="835" text-anchor="middle" font-size="12" font-weight="bold" transform="rotate(-90 25 835)">
    Музыканты и тех. персонал
  </text>

  <!-- =============================================================== -->
  <!-- ============= ДОРОЖКА 1: МУЗЫКАЛЬНЫЙ КОЛЛЕКТИВ ================= -->
  <!-- =============================================================== -->

  <!-- СТАРТ (инициатор — коллектив) -->
  <circle cx="95" cy="155" r="17" fill="#c8e6c9" stroke="#1b5e20" stroke-width="3"/>
  <text x="95" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">СТАРТ</text>
  <text x="95" y="214" text-anchor="middle" font-size="10" fill="#1b5e20">Коллектив решил выступить</text>

  <!-- T1 -->
  <rect x="135" y="115" width="180" height="80" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="225" y="142" text-anchor="middle" font-size="11">
    <tspan x="225" dy="0">Сформулировать идею</tspan>
    <tspan x="225" dy="15">и параметры выступления</tspan>
  </text>

  <!-- T2 -->
  <rect x="350" y="115" width="180" height="80" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="440" y="142" text-anchor="middle" font-size="11">
    <tspan x="440" dy="0">Передать запрос</tspan>
    <tspan x="440" dy="15">администратору</tspan>
  </text>

  <!-- T_review: рассмотрение условий -->
  <rect x="1270" y="115" width="200" height="80" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="1370" y="142" text-anchor="middle" font-size="11">
    <tspan x="1370" dy="0">Рассмотреть</tspan>
    <tspan x="1370" dy="15">предложенные условия</tspan>
  </text>

  <!-- G2: Условия подходят? -->
  <polygon points="1550,115 1590,155 1550,195 1510,155" fill="#fff8e1" stroke="#000" stroke-width="1.5"/>
  <text x="1550" y="160" text-anchor="middle" font-size="14" font-weight="bold">X</text>
  <text x="1550" y="105" text-anchor="middle" font-size="11" font-weight="bold">Условия подходят?</text>

  <!-- =============================================================== -->
  <!-- ============= ДОРОЖКА 2: АДМИНИСТРАТОР ========================= -->
  <!-- =============================================================== -->

  <!-- T3 -->
  <rect x="555" y="450" width="180" height="80" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="645" y="477" text-anchor="middle" font-size="11">
    <tspan x="645" dy="0">Принять задачу,</tspan>
    <tspan x="645" dy="15">уточнить детали</tspan>
  </text>

  <!-- T4 -->
  <rect x="765" y="450" width="180" height="80" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="855" y="477" text-anchor="middle" font-size="11">
    <tspan x="855" dy="0">Поиск подходящей</tspan>
    <tspan x="855" dy="15">площадки / промоутера</tspan>
  </text>

  <!-- G1: Площадка найдена? -->
  <polygon points="1010,450 1050,490 1010,530 970,490" fill="#fff8e1" stroke="#000" stroke-width="1.5"/>
  <text x="1010" y="495" text-anchor="middle" font-size="14" font-weight="bold">X</text>
  <text x="1010" y="440" text-anchor="middle" font-size="11" font-weight="bold">Площадка найдена?</text>

  <!-- T5 -->
  <rect x="1090" y="450" width="180" height="80" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="1180" y="477" text-anchor="middle" font-size="11">
    <tspan x="1180" dy="0">Согласовать условия</tspan>
    <tspan x="1180" dy="15">с площадкой</tspan>
  </text>

  <!-- T6 -->
  <rect x="1300" y="450" width="180" height="80" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="1390" y="477" text-anchor="middle" font-size="11">
    <tspan x="1390" dy="0">Согласовать условия</tspan>
    <tspan x="1390" dy="15">с коллективом</tspan>
  </text>

  <!-- T7 -->
  <rect x="1620" y="450" width="180" height="80" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="1710" y="477" text-anchor="middle" font-size="11">
    <tspan x="1710" dy="0">Подготовить</tspan>
    <tspan x="1710" dy="15">и подписать договор</tspan>
  </text>

  <!-- P1: параллельный шлюз -->
  <polygon points="1850,450 1890,490 1850,530 1810,490" fill="#fff8e1" stroke="#000" stroke-width="1.5"/>
  <text x="1850" y="497" text-anchor="middle" font-size="18" font-weight="bold">+</text>

  <!-- Параллельные задачи -->
  <rect x="1930" y="295" width="210" height="60" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="2035" y="322" text-anchor="middle" font-size="11">
    <tspan x="2035" dy="0">Составить график</tspan>
    <tspan x="2035" dy="14">репетиций, логистика</tspan>
  </text>

  <rect x="1930" y="460" width="210" height="60" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="2035" y="487" text-anchor="middle" font-size="11">
    <tspan x="2035" dy="0">Согласовать технический</tspan>
    <tspan x="2035" dy="14">райдер с площадкой</tspan>
  </text>

  <rect x="1930" y="625" width="210" height="60" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="2035" y="652" text-anchor="middle" font-size="11">
    <tspan x="2035" dy="0">Организовать анонс</tspan>
    <tspan x="2035" dy="14">и продажу билетов</tspan>
  </text>

  <!-- P2: слияние параллельных -->
  <polygon points="2200,450 2240,490 2200,530 2160,490" fill="#fff8e1" stroke="#000" stroke-width="1.5"/>
  <text x="2200" y="497" text-anchor="middle" font-size="18" font-weight="bold">+</text>

  <!-- T11 -->
  <rect x="2290" y="450" width="180" height="80" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="2380" y="477" text-anchor="middle" font-size="11">
    <tspan x="2380" dy="0">Подписать акт,</tspan>
    <tspan x="2380" dy="15">получить расчёт</tspan>
  </text>

  <!-- T12 -->
  <rect x="2510" y="450" width="180" height="80" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="2600" y="477" text-anchor="middle" font-size="11">
    <tspan x="2600" dy="0">Распределить гонорар</tspan>
    <tspan x="2600" dy="15">между участниками</tspan>
  </text>

  <!-- T13 -->
  <rect x="2730" y="450" width="180" height="80" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="2820" y="477" text-anchor="middle" font-size="11">
    <tspan x="2820" dy="0">Подготовить отчёт</tspan>
    <tspan x="2820" dy="15">о мероприятии</tspan>
  </text>

  <!-- =============================================================== -->
  <!-- ============= ДОРОЖКА 3: МУЗЫКАНТЫ И ТЕХ ======================= -->
  <!-- =============================================================== -->

  <rect x="1930" y="770" width="210" height="80" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="2035" y="800" text-anchor="middle" font-size="11">
    <tspan x="2035" dy="0">Провести репетицию</tspan>
    <tspan x="2035" dy="15">и саундчек</tspan>
  </text>

  <rect x="2190" y="770" width="190" height="80" rx="8" fill="#ffffff" stroke="#000"/>
  <text x="2285" y="800" text-anchor="middle" font-size="11">
    <tspan x="2285" dy="0">Выступить</tspan>
    <tspan x="2285" dy="15">на концерте</tspan>
  </text>

  <!-- КОНЕЦ -->
  <circle cx="2960" cy="490" r="18" fill="#ffffff" stroke="#000" stroke-width="4"/>
  <circle cx="2960" cy="490" r="12" fill="#ffcdd2" stroke="#b71c1c" stroke-width="2"/>
  <text x="2960" y="535" text-anchor="middle" font-size="11" font-weight="bold">Мероприятие</text>
  <text x="2960" y="549" text-anchor="middle" font-size="11" font-weight="bold">завершено</text>

  <!-- =============================================================== -->
  <!-- ============= СВЯЗИ (ПОТОКИ) =================================== -->
  <!-- =============================================================== -->

  <!-- Старт → T1 -->
  <path d="M 112 155 L 135 155" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- T1 → T2 -->
  <path d="M 315 155 L 350 155" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- T2 → T3 (вниз в дорожку администратора) -->
  <path d="M 530 155 L 645 155 L 645 450" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- T3 → T4 -->
  <path d="M 735 490 L 765 490" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- T4 → G1 -->
  <path d="M 945 490 L 970 490" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- G1 → T5 (Да) -->
  <path d="M 1050 490 L 1090 490" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1062" y="480" font-size="11" font-weight="bold" fill="#1b5e20">Да</text>

  <!-- G1 → T4 (Нет) — возврат к поиску -->
  <path d="M 1010 530 L 1010 585 L 855 585 L 855 530" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1020" y="555" font-size="11" font-weight="bold" fill="#b71c1c">Нет</text>

  <!-- T5 → T6 -->
  <path d="M 1270 490 L 1300 490" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- T6 → T_review (вверх в коллектив) -->
  <path d="M 1390 450 L 1390 195" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- T_review → G2 -->
  <path d="M 1470 155 L 1510 155" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- G2 → T7 (Да) -->
  <path d="M 1590 155 L 1710 155 L 1710 450" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1610" y="145" font-size="11" font-weight="bold" fill="#1b5e20">Да</text>

  <!-- G2 → T6 (Нет) — возврат к согласованию -->
  <path d="M 1550 195 L 1550 490 L 1480 490" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1558" y="300" font-size="11" font-weight="bold" fill="#b71c1c">Нет</text>

  <!-- T7 → P1 -->
  <path d="M 1800 490 L 1810 490" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- P1 → T8 (вверх) -->
  <path d="M 1850 450 L 1850 325 L 1930 325" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- P1 → T9 (прямо) -->
  <path d="M 1890 490 L 1930 490" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- P1 → T10 (вниз) -->
  <path d="M 1850 530 L 1850 655 L 1930 655" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- T8 → P2 -->
  <path d="M 2140 325 L 2200 325 L 2200 450" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- T9 → P2 -->
  <path d="M 2140 490 L 2160 490" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- T10 → P2 -->
  <path d="M 2140 655 L 2200 655 L 2200 530" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- P2 → Репетиция (вниз в дорожку музыкантов) -->
  <path d="M 2200 530 L 2200 745 L 2035 745 L 2035 770" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Репетиция → Концерт -->
  <path d="M 2140 810 L 2190 810" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Концерт → T11 (вверх в дорожку администратора) -->
  <path d="M 2280 770 L 2280 530" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- T11 → T12 -->
  <path d="M 2470 490 L 2510 490" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- T12 → T13 -->
  <path d="M 2690 490 L 2730 490" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- T13 → Конец -->
  <path d="M 2910 490 L 2942 490" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- =============================================================== -->
  <!-- ============= ЛЕГЕНДА ========================================== -->
  <!-- =============================================================== -->
  <g transform="translate(80, 900)">
    <rect x="0" y="0" width="2900" height="70" rx="6" fill="#f9f9f9" stroke="#333" stroke-width="1"/>
    <text x="1520" y="22" text-anchor="middle" font-size="12" font-weight="bold">Условные обозначения</text>
    <line x1="0" y1="30" x2="2900" y2="30" stroke="#999"/>

    <circle cx="40" cy="50" r="11" fill="#c8e6c9" stroke="#1b5e20" stroke-width="2"/>
    <text x="60" y="54" font-size="11">Старт (инициатор — коллектив)</text>

    <circle cx="290" cy="50" r="11" fill="#ffffff" stroke="#000" stroke-width="3"/>
    <circle cx="290" cy="50" r="7" fill="#ffcdd2" stroke="#b71c1c" stroke-width="1.5"/>
    <text x="310" y="54" font-size="11">Конец</text>

    <rect x="420" y="40" width="40" height="20" rx="4" fill="#fff" stroke="#000"/>
    <text x="470" y="54" font-size="11">Задача</text>

    <polygon points="580,40 600,50 580,60 560,50" fill="#fff8e1" stroke="#000"/>
    <text x="612" y="54" font-size="11">Шлюз «исключающее ИЛИ» (X)</text>

    <polygon points="810,40 830,50 810,60 790,50" fill="#fff8e1" stroke="#000"/>
    <text x="838" y="54" font-size="14" font-weight="bold">+</text>
    <text x="855" y="54" font-size="11">Шлюз «параллельный»</text>

    <line x1="1050" y1="50" x2="1090" y2="50" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="1100" y="54" font-size="11">Поток управления</text>

    <text x="1280" y="54" font-size="11" font-weight="bold">Да</text>
    <text x="1310" y="54" font-size="11">— ветка «да»</text>
    <text x="1420" y="54" font-size="11" font-weight="bold" fill="#b71c1c">Нет</text>
    <text x="1455" y="54" font-size="11">— ветка «нет» (возврат)</text>

    <text x="1650" y="54" font-size="11">Процесс инициирует сам коллектив, площадка — партнёр</text>
  </g>

</svg>