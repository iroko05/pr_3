an></text><text x="825" y="1992" font-size="19" text-anchor="middle" font-weight="normal"><tspan x="825" dy="0">Круг — событие начала или завершения; прямоугольник — задача;</tspan></text><text x="825" y="2020" font-size="19" text-anchor="middle" font-weight="normal"><tspan x="825" dy="0">ромб с крестом — выбор одного пути; стрелка — последовательность выполнения.</tspan></text><text x="825" y="2050" font-size="19" text-anchor="middle" font-weight="normal"><tspan x="825" dy="0">После замечаний коллектива администратор повторно подбирает условия концерта.</tspan></text></svg>